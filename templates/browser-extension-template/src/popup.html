<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extName">Extension</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <h1 data-i18n="extName">Extension</h1>
      <label class="toggle">
        <input id="enabled" type="checkbox">
        <span data-i18n="enabledLabel">Enable extension</span>
      </label>
      <button id="openOptions" type="button" data-i18n="openOptions">Open settings</button>
    </main>
  </body>
</html>
