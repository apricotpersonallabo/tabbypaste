name: browser-extension-template-tests

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: browser-extension-template/test-runner:22.23.2
    init: true
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    environment:
      SELENIUM_CHROMIUM_URL: http://chromium:4444/wd/hub
      SELENIUM_FIREFOX_URL: http://firefox:4444/wd/hub
    volumes:
      - .:/workspace
    depends_on:
      chromium:
        condition: service_healthy
      firefox:
        condition: service_healthy

  chromium:
    build:
      context: .
      dockerfile: Dockerfile.selenium-chromium
    image: browser-extension-template/selenium-chromium:4.46.0-20260707
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - .:/workspace:ro

  firefox:
    build:
      context: .
      dockerfile: Dockerfile.selenium-firefox
    image: browser-extension-template/selenium-firefox:4.46.0-20260707
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - .:/workspace:ro
