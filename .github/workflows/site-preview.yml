name: Site preview (migration)

on:
  pull_request:
    paths:
      - "site/**"
      - "src/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/site-preview.yml"
  workflow_dispatch:

jobs:
  preview:
    uses: apricotpersonallabo/site-platform/.github/workflows/site-preview.yml@fea5c9ea87f67cd4d666ed4fdade25f9dcff9759
    with:
      site-directory: site
      artifact-name: tabbypaste-site-preview
