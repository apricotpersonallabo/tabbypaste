      - "site/**"
      - "src/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/site-preview.yml"
  workflow_dispatch:

jobs:
  preview:
    uses: apricotpersonallabo/apricotpersonallabo/.github/workflows/site-preview.yml@d5681fa8228fdfbceae181afdc7222340bb8ca4a
    with:
      site-directory: site
      artifact-name: tabbypaste-site-preview
