# .github/workflows/main.yml
name: Build and release browser extensions

on:
  workflow_dispatch:
  push:
    branches: [ main ]  # adjust if needed

permissions: {}

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      chromium_zip: ${{ steps.zip.outputs.chromium_zip }}
      firefox_zip: ${{ steps.zip.outputs.firefox_zip }}

    steps:
      - name: Check out repo (with tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Ensure version files exist
        run: |
          test -f "version.json" || (echo "version.json not found"; exit 1)
          test -f "src/manifest.json" || (echo "src/manifest.json not found"; exit 1)
          test -f "src/manifest.firefox.json" || (echo "src/manifest.firefox.json not found"; exit 1)

      - name: Increment and synchronize version
        run: node scripts/sync-manifest-version.mjs --increment

      - name: Read synchronized version
        id: ver
        run: |
          VERSION=$(jq -r '.version' "version.json")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No version found in version.json"; exit 1
          fi
          test "$(jq -r '.version' src/manifest.json)" = "$VERSION"
          test "$(jq -r '.version' src/manifest.firefox.json)" = "$VERSION"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get repo name
        id: repo
        run: |
          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Fail if the release/tag already exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          RELEASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_URL")
          if [ "$STATUS" -eq 200 ]; then
            echo "Release for tag $TAG already exists."
            exit 1
          fi

      - name: Commit synchronized version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json src/manifest.json src/manifest.firefox.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump extension version to $VERSION [skip ci]"
            git push
          fi

      - name: Create browser packages (zip root contains manifest.json)
        id: zip
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          REPO_NAME="${{ steps.repo.outputs.repo_name }}"
          CHROMIUM_ZIP="${REPO_NAME}-${TAG}-chromium.zip"
          FIREFOX_ZIP="${REPO_NAME}-${TAG}-firefox.zip"
          mkdir -p build/chromium build/firefox
          rsync -a --exclude "manifest.firefox.json" src/ build/chromium/
          rsync -a --exclude "manifest.json" --exclude "manifest.firefox.json" src/ build/firefox/
          cp src/manifest.firefox.json build/firefox/manifest.json
          (cd build/chromium && zip -r "../../$CHROMIUM_ZIP" . -x "node_modules/*" "*.map" ".DS_Store" "*.log")
          (cd build/firefox && zip -r "../../$FIREFOX_ZIP" . -x "node_modules/*" "*.map" ".DS_Store" "*.log")
          echo "chromium_zip=$CHROMIUM_ZIP" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=$FIREFOX_ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload browser packages for store jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension-packages-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.zip.outputs.chromium_zip }}
            ${{ steps.zip.outputs.firefox_zip }}
          if-no-files-found: error
          retention-days: 7

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.zip.outputs.chromium_zip }}
            ${{ steps.zip.outputs.firefox_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-chrome:
    name: Submit to Chrome Web Store
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    steps:
      - name: Check Chrome Web Store configuration
        id: config
        shell: bash
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: |
          if [[ -n "$CHROME_CLIENT_ID" && -n "$CHROME_CLIENT_SECRET" && -n "$CHROME_REFRESH_TOKEN" && -n "$CHROME_PUBLISHER_ID" && -n "$CHROME_EXTENSION_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store submission skipped because its secrets or variables are not configured."
          fi

      - name: Check out submission script
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate Chrome submission script
        if: steps.config.outputs.enabled == 'true'
        run: |
          node --check scripts/submit-store.mjs
          node --test scripts/submit-store.test.mjs

      - name: Download browser packages
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-extension-packages-${{ needs.build-and-release.outputs.version }}
          path: dist

      - name: Upload and submit Chrome package
        if: steps.config.outputs.enabled == 'true'
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
        run: node scripts/submit-store.mjs chrome "dist/${{ needs.build-and-release.outputs.chromium_zip }}"

  submit-edge:
    name: Submit to Microsoft Edge Add-ons
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: browser-stores
    steps:
      - name: Check Microsoft Edge Add-ons configuration
        id: config
        shell: bash
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: |
          if [[ -n "$EDGE_CLIENT_ID" && -n "$EDGE_API_KEY" && -n "$EDGE_PRODUCT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Microsoft Edge Add-ons submission skipped because its secrets or variables are not configured."
          fi

      - name: Check out submission script
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download browser packages
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-extension-packages-${{ needs.build-and-release.outputs.version }}
          path: dist

      - name: Upload and submit Edge package
        if: steps.config.outputs.enabled == 'true'
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_PUBLISH_NOTES: Release ${{ needs.build-and-release.outputs.version }} from GitHub Actions.
        run: node scripts/submit-store.mjs edge "dist/${{ needs.build-and-release.outputs.chromium_zip }}"

  submit-firefox:
    name: Submit to Firefox Add-ons
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: browser-stores
    steps:
      - name: Check Firefox Add-ons configuration
        id: config
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -n "$WEB_EXT_API_KEY" && -n "$WEB_EXT_API_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firefox Add-ons submission skipped because its secrets are not configured."
          fi

      - name: Check out AMO metadata
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download browser packages
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: browser-extension-packages-${{ needs.build-and-release.outputs.version }}
          path: dist

      - name: Extract Firefox package
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir firefox-source
          unzip -q "dist/${{ needs.build-and-release.outputs.firefox_zip }}" -d firefox-source

      - name: Install pinned Firefox submission tooling
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Upload and submit Firefox package
        if: steps.config.outputs.enabled == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: pnpm exec web-ext sign --source-dir firefox-source --channel listed --amo-metadata amo-metadata.json --approval-timeout 0 --no-input
